name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev]"
      - run: python -m ruff check .
      - run: python -m compileall -q app src
      - run: python -m pytest --cov=douyin_knowledge --cov-report=term-missing --cov-fail-under=80
      - shell: powershell
        run: |
          Get-ChildItem scripts -Filter *.ps1 | ForEach-Object {
            [void][scriptblock]::Create((Get-Content -Raw -LiteralPath $_.FullName))
          }
      - run: python -m build
      - shell: powershell
        run: |
          $wheel = Get-ChildItem dist -Filter *.whl | Select-Object -First 1
          .\scripts\test-distribution.ps1 -WheelPath $wheel.FullName -Python python
